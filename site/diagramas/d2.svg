<path d="M 190.0,136.0 L 196.0,79.0" stroke="#9b3b26" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" fill="none"/>
<circle cx="196.0" cy="79.0" r="2.6" fill="#9b3b26"/>
<circle cx="246.0" cy="138.0" r="3" fill="#9b3b26"/>
<path d="M 246.0,138.0 Q 256.0,138.0 266.0,138.0" fill="none" stroke="#9b3b26" stroke-width="1.3" stroke-linecap="round" marker-end="url(#tBred)"/>
<path d="M 246.0,136.0 L 252.0,84.0" stroke="#9b3b26" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.8" fill="none"/>
<circle cx="252.0" cy="84.0" r="2.6" fill="#9b3b26"/>
<path d="M 140.0,86.0 C 149.3,84.8 177.3,79.3 196.0,79.0 C 214.7,78.7 242.7,83.2 252.0,84.0" fill="none" stroke="#9b3b26" stroke-width="1.6" stroke-linecap="round"/>
<text x="370.0" y="74.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">Give velocities a space of their own:</text><text x="370.0" y="89.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">a point of TM is a position together</text><text x="370.0" y="104.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">with a velocity, and a motion becomes</text><text x="370.0" y="119.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">a curve drawn up there.</text>
<path d="M 40.0,160.0 L 640.0,160.0" stroke="#a08050" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.5" fill="none"/>
<circle cx="44" cy="237" r="13" fill="none" stroke="#a08050" stroke-width="1"/><text x="44.0" y="242.0" font-size="13" font-family="'EB Garamond',Georgia,serif" fill="#5c3d1e" text-anchor="middle">2</text>
<path d="M 96.0,220.0 L 236.0,220.0" stroke="#a08050" stroke-width="1.0" stroke-linecap="round" fill="none"/>
<circle cx="116.0" cy="220.0" r="3.2" fill="#1a1208"/>
