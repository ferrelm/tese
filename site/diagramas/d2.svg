<circle cx="300.0" cy="248.0" r="3.2" fill="#9b3b26"/>
<path d="M 300.0,248.0 Q 315.0,248.0 330.0,248.0" fill="none" stroke="#9b3b26" stroke-width="1.3" stroke-linecap="round" marker-end="url(#tBred)"/>
