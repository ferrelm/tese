<path d="M 180.0,276.0 Q 195.0,276.0 210.0,276.0" fill="none" stroke="#1a1208" stroke-width="1.3" stroke-linecap="round" marker-end="url(#tBink)"/>
<path d="M 272.0,276.0 L 412.0,276.0" stroke="#a08050" stroke-width="1.0" stroke-linecap="round" fill="none"/>
<circle cx="300.0" cy="276.0" r="3.2" fill="#9b3b26"/>
<path d="M 300.0,276.0 Q 323.0,276.0 346.0,276.0" fill="none" stroke="#9b3b26" stroke-width="1.3" stroke-linecap="round" marker-end="url(#tBred)"/>
<path d="M 84.0,214.0 Q 84.0,249.0 84.0,284.0" fill="none" stroke="#6b5a3e" stroke-width="1" stroke-linecap="round" marker-end="url(#tBfnt)"/>
<text x="70.0" y="210.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">t</text>
<text x="96.0" y="302.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">honest: the dot moves, and the</text>
<text x="96.0" y="315.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">arrow is the rate at which it does</text>
<text x="272.0" y="302.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">dishonest: the arrow grows while</text>
<text x="272.0" y="315.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">the dot never moves at all</text>
<text x="438.0" y="232.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">A curve in TM moves two things</text><text x="438.0" y="247.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">at once, and nothing forces the</text><text x="438.0" y="262.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">second to be the derivative of the</text><text x="438.0" y="277.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">first. Most curves up there are</text><text x="438.0" y="292.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">not motions.</text>
<path d="M 40.0,318.0 L 640.0,318.0" stroke="#a08050" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.5" fill="none"/>
<circle cx="44" cy="395" r="13" fill="none" stroke="#a08050" stroke-width="1"/><text x="44.0" y="400.0" font-size="13" font-family="'EB Garamond',Georgia,serif" fill="#5c3d1e" text-anchor="middle">3</text>
<polygon points="120,386 268,386 296,368 148,368" fill="rgba(150,175,215,0.10)" stroke="#a08050" stroke-width="0.9"/>
<text x="302.0" y="374.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">TTM</text>
<path d="M 160.0,392.0 Q 136.2,405.5 124.0,430.0" fill="none" stroke="#1a1208" stroke-width="1.3" stroke-linecap="round" marker-end="url(#tBink)"/>
<text x="96.0" y="414.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">τ</text>
<text x="103.0" y="418.0" font-size="8" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">TM</text>
<path d="M 232.0,392.0 Q 255.8,405.5 268.0,430.0" fill="none" stroke="#8b6239" stroke-width="1.3" stroke-linecap="round" marker-end="url(#tBacc)"/>
<text x="276.0" y="414.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#5c3d1e">T</text>
<text x="283.0" y="414.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#5c3d1e">τ</text>
<text x="290.0" y="418.0" font-size="8" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#5c3d1e">M</text>
<polygon points="104,454 288,454 316,436 132,436" fill="rgba(150,175,215,0.10)" stroke="#a08050" stroke-width="0.9"/>
<text x="322.0" y="442.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">TM</text>
<circle cx="196.0" cy="445.0" r="4" fill="#9b3b26"/>
<text x="150.0" y="470.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">the two readings land on the same point</text>
<text x="370.0" y="390.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">TTM comes back down to TM in two</text><text x="370.0" y="405.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">different ways: one keeps the pair the</text><text x="370.0" y="420.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">arrow sits on, the other reads the</text><text x="370.0" y="435.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">arrow as a velocity below. A motion is</text><text x="370.0" y="450.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">a field on which the two agree.</text>
</svg>