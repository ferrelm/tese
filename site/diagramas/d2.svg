<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 496" width="680" height="496" xmlns="http://www.w3.org/2000/svg">
<title>The argument of the second half, in three steps</title>
<desc>Three panels read downwards. One: velocities are given a space of their own, so that a motion becomes a curve in TM. Two: a curve there moves position and velocity independently, and most such curves are not motions — the arrow may grow while the point stands still. Three: TTM projects onto TM in two different ways, and an equation of motion is a field on which the two readings agree.</desc>
<defs><marker id="tBink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#1a1208" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tBacc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#8b6239" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tBred" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#9b3b26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tBfnt" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#6b5a3e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<circle cx="44" cy="79" r="13" fill="none" stroke="#a08050" stroke-width="1"/><text x="44.0" y="84.0" font-size="13" font-family="'EB Garamond',Georgia,serif" fill="#5c3d1e" text-anchor="middle">1</text>
<polygon points="96,100 288,100 320,76 128,76" fill="rgba(150,175,215,0.10)" stroke="#a08050" stroke-width="0.9"/>
<text x="326.0" y="80.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">TM</text>
<path d="M 96.0,138.0 L 300.0,138.0" stroke="#1a1208" stroke-width="1.4" stroke-linecap="round" fill="none"/>
<text x="306.0" y="142.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">M</text>
