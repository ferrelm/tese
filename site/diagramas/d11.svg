<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 296" width="680" height="296" xmlns="http://www.w3.org/2000/svg">
<title>A manifold covered by two charts, and the transition map between them</title>
<desc>A curved patch M carrying two overlapping regions U and V. Each is carried by a chart, phi and psi, onto an open set of R^n drawn below; the shaded overlap appears in both images, and the map between those two images, psi after phi inverse, is the transition map, required to be smooth.</desc>
