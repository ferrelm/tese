<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 266" width="680" height="266" xmlns="http://www.w3.org/2000/svg">
<title>A canonical transformation preserves the symplectic form, and with it the area</title>
<desc>A shaded disc in the q-p plane on the left, and on the right its image under a canonical transformation: bent out of shape but enclosing the same area, because in two dimensions the symplectic form is exactly area.</desc>
