<text x="317.0" y="152.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e" text-anchor="middle">φ*ω = ω</text>
<text x="60.0" y="238.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">A canonical transformation may bend a region out of shape, but it cannot change the area it</text>
<text x="60.0" y="252.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">encloses: in two dimensions the symplectic form is area, and preserving ω is preserving it.</text>
