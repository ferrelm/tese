<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 268" width="680" height="268" xmlns="http://www.w3.org/2000/svg">
<title>Frobenius' theorem: when a field of planes fits together into surfaces and when it does not</title>
<desc>On the left, plane elements all lying in a stack of parallel surfaces: the distribution is involutive and therefore integrable, and the surfaces are the leaves of a foliation. On the right, plane elements that rotate steadily as one moves along a direction: no surface can be tangent to all of them, the bracket of two fields lying in the distribution leaves it, and there is no foliation.</desc>
<defs><marker id="q4ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#1a1208" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="q4acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#8b6239" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="q4red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#9b3b26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="q4fnt" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#6b5a3e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
