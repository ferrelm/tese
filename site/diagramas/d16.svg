<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 262" width="680" height="262" xmlns="http://www.w3.org/2000/svg">
<title>The Hamiltonian field runs along the level sets of H</title>
<desc>Three nested closed curves are level sets of an observable H on a two-dimensional phase space. Arrows drawn at three points of the middle curve show the Hamiltonian field X_H, tangent to the curve; a further arrow crossing the levels is dH. Because the flow stays on a level set, H is constant along it, and so is any observable whose bracket with H vanishes.</desc>
<defs><marker id="q6ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#1a1208" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="q6acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#8b6239" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="q6red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#9b3b26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="q6fnt" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#6b5a3e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g transform="translate(0,-38)"><ellipse cx="268" cy="160" rx="62" ry="44" fill="none" stroke="#a08050" stroke-width="1.0"/>
<ellipse cx="268" cy="160" rx="100" ry="70" fill="none" stroke="#5c3d1e" stroke-width="1.7"/>
<ellipse cx="268" cy="160" rx="138" ry="96" fill="none" stroke="#a08050" stroke-width="1.0"/>
<text x="334.0" y="154.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">H = c₁</text>
<text x="372.0" y="154.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#5c3d1e">c₂</text>
<text x="410.0" y="154.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">c₃</text>
<path d="M 344.6,115.0 Q 330.0,102.8 315.4,90.7" fill="none" stroke="#9b3b26" stroke-width="1.7" stroke-linecap="round" marker-end="url(#q6red)"/>
<path d="M 181.4,125.0 Q 169.3,139.7 157.2,154.3" fill="none" stroke="#9b3b26" stroke-width="1.7" stroke-linecap="round" marker-end="url(#q6red)"/>
<path d="M 259.3,229.7 Q 278.2,230.9 297.2,232.1" fill="none" stroke="#9b3b26" stroke-width="1.7" stroke-linecap="round" marker-end="url(#q6red)"/>
<path d="M 344.6,115.0 Q 359.3,97.3 374.1,79.7" fill="none" stroke="#1a1208" stroke-width="1.5" stroke-linecap="round" marker-end="url(#q6ink)"/>
<text x="380.1" y="77.7" font-size="13" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">dH</text>
<text x="172.0" y="272.0" font-size="13.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">X</text>
<text x="181.0" y="276.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">H</text>
<text x="198.0" y="272.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">runs along the level sets</text>
<text x="452.0" y="104.0" font-size="14" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">ι</text>
<text x="459.0" y="108.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">X</text>
<text x="466.0" y="111.0" font-size="8" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">H</text>
<text x="474.0" y="104.0" font-size="14" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">ω = dH</text>
<text x="452.0" y="132.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">The flow of X</text>
<text x="524.0" y="136.0" font-size="8" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">H</text>
<text x="531.0" y="132.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e"> is tangent to</text>
<text x="452.0" y="148.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">the level sets of H, so H itself</text>
<text x="452.0" y="164.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">is constant along it: energy is</text>
<text x="452.0" y="180.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">conserved. Any f with {f,H} = 0</text>
<text x="452.0" y="196.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">is conserved for the same reason.</text></g>
</svg>