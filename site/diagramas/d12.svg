<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 232" width="680" height="232" xmlns="http://www.w3.org/2000/svg">
<title>A vector bundle: base, fibres, a section, and a subbundle inside it</title>
<desc>A base M drawn as a line at the foot, with a fibre standing over each of several of its points and the whole assembled into the total space E, projected onto M by pi. A wavy curve crossing every fibre once is a section. A shaded band occupying the lower part of each fibre is a subbundle: the same base, smaller fibres.</desc>
