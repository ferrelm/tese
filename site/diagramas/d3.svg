<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 300" width="680" height="300" xmlns="http://www.w3.org/2000/svg">
<title>Axes x, y and z with the vertical lines of the kernel and the level surfaces of g</title>
<desc>Axes x, y and z from an origin, with the x-y plane in perspective. Two level curves of g drawn on the plane are crossed by vertical lines with arrows — the leaves of the kernel of omega-flat, generated by d/dz; one of the arrows points downwards, because lambda may be negative. Over each curve stands the level surface of g, vertical: g is constant along each line, that is X·g = 0.</desc>
