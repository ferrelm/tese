<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 278" width="680" height="278" xmlns="http://www.w3.org/2000/svg">
<title>A foliation and its leaf space</title>
<desc>On the left a region filled by parallel leaves, one of them highlighted. On the right the leaf space: each leaf has become a single point of a line, the highlighted leaf giving the highlighted point. The leaf space always has a topology but need not be a manifold.</desc>
