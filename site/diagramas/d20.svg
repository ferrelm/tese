<text x="56.0" y="250.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">Collapsing each leaf to a point gives the leaf space. It carries a topology always, but is a</text>
<text x="56.0" y="264.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">manifold only under further hypotheses — which is why the quotients of page 4 are local.</text>
