<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 348" width="680" height="348" xmlns="http://www.w3.org/2000/svg">
<title>Rhombic diagram: TTM on top, two copies of TM at the sides, M at the base</title>
<desc>A rhombus with TTM on top, two copies of TM on the left and on the right, and M below. The section X rises from each TM to TTM; tau_TM comes down to the left copy and T tau_M to the right one; Id links the two copies and tau_M carries each of them to M. tau_TM∘X = Id because X is a vector field; T tau_M∘X = Id is the definition of a second-order equation. The diagram commutes except in the cycles involving only two arrows.</desc>
