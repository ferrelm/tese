<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 476" width="680" height="476" xmlns="http://www.w3.org/2000/svg">
<title>Another scheme: TTM, TM and M stacked, the interval I and the routes ① and ②</title>
<desc>Three parallel sheets stacked — TTM on top, TM in the middle, M at the bottom — and, on the right, the interval I. Three curves issue from I: (X∘c) = c' to TTM, c to TM and tau_M∘c to M. Between TTM and TM run two arrows: tau_TM, whose image is marked ①, and T tau_M, marked ②; X rises from TM to TTM, tau_M comes down from TM to M and T(tau_M∘c) rises again. On the left the charts phi, T phi and T² phi. X is a second-order equation exactly when the curves ① and ② coincide.</desc>
