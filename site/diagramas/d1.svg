<circle cx="342.0" cy="856.0" r="3.4" fill="#1a1208"/>
<circle cx="342.0" cy="880.0" r="3.4" fill="#1a1208"/>
<circle cx="342.0" cy="904.0" r="3.4" fill="#1a1208"/>
<text x="392.0" y="856.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">Collapse each surface to a point.</text><text x="392.0" y="871.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">What is left has no invisible</text><text x="392.0" y="886.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">directions — not because the form</text><text x="392.0" y="901.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">was repaired, but because what it</text><text x="392.0" y="916.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">could not see is gone.</text>
</svg>