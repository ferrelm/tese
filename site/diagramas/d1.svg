<path d="M 134.0,710.0 Q 119.7,724.0 118.0,744.0" fill="none" stroke="#1a1208" stroke-width="1.3" stroke-linecap="round" marker-end="url(#tAink)"/>
<path d="M 118.0,744.0 Q 119.0,753.3 110.0,756.0" fill="none" stroke="#5c3d1e" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="3 3" marker-end="url(#tAacc)"/>
<text x="92.0" y="780.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#5c3d1e">the mismatch is invisible too</text>
<polygon points="264,748 358,748 392,726 298,726" fill="rgba(150,175,215,0.10)" stroke="#a08050" stroke-width="0.9"/>
<polygon points="264,724 358,724 392,702 298,702" fill="rgba(150,175,215,0.10)" stroke="#a08050" stroke-width="0.9"/>
