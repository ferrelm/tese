<path d="M 150.0,368.0 Q 150.0,407.0 150.0,446.0" fill="none" stroke="#5c3d1e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#tAacc)"/>
<text x="126.0" y="364.0" font-size="12" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#5c3d1e">k</text>
<text x="360.0" y="382.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">Let one direction become invisible.</text><text x="360.0" y="397.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">Any multiple of it may now be added</text><text x="360.0" y="412.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">and nothing in the equation notices:</text><text x="360.0" y="427.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">what the quantity names is a family</text><text x="360.0" y="442.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">of motions, not a motion.</text>
<path d="M 40.0,476.0 L 640.0,476.0" stroke="#a08050" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.5" fill="none"/>
