<path d="M 190.0,526.0 L 190.0,606.0" stroke="#5c3d1e" stroke-width="1.6" stroke-linecap="round" fill="none"/>
<circle cx="190.0" cy="542.0" r="3.4" fill="#1a1208"/>
<circle cx="190.0" cy="592.0" r="3.4" fill="#1a1208"/>
<text x="198.0" y="540.0" font-size="12" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">p</text>
<text x="198.0" y="596.0" font-size="12" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">p′</text>
<text x="216.0" y="540.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">g = 3,  f = 7</text>
<text x="216.0" y="596.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">g = 3,  f = 7</text>
<path d="M 174.0,590.0 Q 174.0,569.0 174.0,548.0" fill="none" stroke="#8b6239" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#tAacc)"/>
<text x="100.0" y="572.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#8b6239">invisible</text>
<text x="360.0" y="548.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">Along an invisible direction nothing</text><text x="360.0" y="563.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">measurable changes. The two points</text><text x="360.0" y="578.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">are one situation wearing two</text><text x="360.0" y="593.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">different labels.</text>
<path d="M 40.0,634.0 L 640.0,634.0" stroke="#a08050" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.5" fill="none"/>
<circle cx="44" cy="711" r="13" fill="none" stroke="#a08050" stroke-width="1"/><text x="44.0" y="716.0" font-size="13" font-family="'EB Garamond',Georgia,serif" fill="#5c3d1e" text-anchor="middle">4</text>
<path d="M 110.0,756.0 Q 142.9,758.9 174.0,748.0" fill="none" stroke="#1a1208" stroke-width="1.3" stroke-linecap="round" marker-end="url(#tAink)"/>
