<text x="170.0" y="210.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#5c3d1e">grad g</text>
<text x="100.0" y="294.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">with a metric: across the levels</text>
<circle cx="300.0" cy="246.0" r="3.2" fill="#9b3b26"/>
<path d="M 300.0,246.0 Q 339.0,246.0 378.0,246.0" fill="none" stroke="#9b3b26" stroke-width="1.7" stroke-linecap="round" marker-end="url(#tAred)"/>
<text x="338.0" y="236.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">X</text>
<text x="346.0" y="240.0" font-size="8" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">g</text>
<text x="268.0" y="294.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">with ω: along them</text>
<text x="414.0" y="214.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">Same recipe, different instrument. A</text><text x="414.0" y="229.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">metric is symmetric and gives the</text><text x="414.0" y="244.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">gradient, climbing across the levels;</text><text x="414.0" y="259.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">ω changes sign when its arguments are</text><text x="414.0" y="274.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">swapped, and that turns the answer a</text><text x="414.0" y="289.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">quarter turn — along them instead. Which</text><text x="414.0" y="304.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">is why a quantity is conserved by the</text><text x="414.0" y="319.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">motion it itself generates.</text>
