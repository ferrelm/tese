<text x="306.0" y="84.0" font-size="12" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">X</text>
<text x="314.0" y="88.0" font-size="9" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">g</text>
<text x="360.0" y="74.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">The form sees every direction, so the</text><text x="360.0" y="89.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">equation for the motion has exactly</text><text x="360.0" y="104.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">one solution: a quantity names one</text><text x="360.0" y="119.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">motion, and only one.</text>
<path d="M 40.0,160.0 L 640.0,160.0" stroke="#a08050" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.5" fill="none"/>
<text x="58.0" y="238.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e" text-anchor="middle">an aside</text>
