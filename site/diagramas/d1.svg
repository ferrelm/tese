<path d="M 220.0,726.0 Q 238.0,726.0 256.0,726.0" fill="none" stroke="#6b5a3e" stroke-width="1.1" stroke-linecap="round" marker-end="url(#tAfnt)"/>
<text x="414.0" y="698.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">Follow two invisible directions, in</text><text x="414.0" y="713.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">one order and then the other: the</text><text x="414.0" y="728.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">mismatch is invisible again, because</text><text x="414.0" y="743.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">ω is closed. So they knit together</text><text x="414.0" y="758.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">into surfaces.</text>
<path d="M 40.0,792.0 L 640.0,792.0" stroke="#a08050" stroke-width="0.7" stroke-linecap="round" stroke-dasharray="4 5" opacity="0.5" fill="none"/>
<circle cx="44" cy="869" r="13" fill="none" stroke="#a08050" stroke-width="1"/><text x="44.0" y="874.0" font-size="13" font-family="'EB Garamond',Georgia,serif" fill="#5c3d1e" text-anchor="middle">5</text>
<polygon points="100,906 194,906 228,884 134,884" fill="rgba(150,175,215,0.10)" stroke="#a08050" stroke-width="0.9"/>
<polygon points="100,882 194,882 228,860 134,860" fill="rgba(150,175,215,0.10)" stroke="#a08050" stroke-width="0.9"/>
