<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 970" width="680" height="970" xmlns="http://www.w3.org/2000/svg">
<title>The argument of the first half, in five steps, with an aside on the gradient</title>
<desc>Five numbered panels read downwards, with an aside after the first comparing the gradient, which crosses the level sets, with the Hamiltonian field, which follows them. One: the form sees every direction and a quantity names a single motion. Two: one direction becomes invisible and the motion becomes a family. Three: the invisible direction joins two points at which every measurement agrees. Four: following two invisible directions in either order leaves an invisible mismatch, so they knit into surfaces. Five: collapsing each surface to a point leaves a space in which nothing is invisible.</desc>
<defs><marker id="tAink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#1a1208" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tAacc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#8b6239" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tAred" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#9b3b26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="tAfnt" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#6b5a3e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
