<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 282" width="680" height="282" xmlns="http://www.w3.org/2000/svg">
<title>A vector field, its integral curves and its flow</title>
<desc>Small arrows give the value of a vector field over a region. Three curves run everywhere tangent to them: they are integral curves. A shaded blob is carried by the flow, in a time t, to the dashed blob further along; the rate of change of a quantity under this transport is the Lie derivative.</desc>
