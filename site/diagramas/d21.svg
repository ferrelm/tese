<text x="120.0" y="254.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">The arrows are the field; the curves running along them are its integral curves; and the flow</text>
<text x="120.0" y="268.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">carries the shaded blob along in time t. The Lie derivative is the rate of change under this flow.</text>
