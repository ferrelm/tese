<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 246" width="680" height="246" xmlns="http://www.w3.org/2000/svg">
<title>The tangent bundle of the circle is a cylinder</title>
<desc>On the left a circle with tangent vectors drawn at five of its points. On the right the same data assembled into a cylinder: each vertical line is the fibre over one point of the circle, the dashed middle circle is the zero section, and a wavy closed curve running around the cylinder is a vector field on the circle seen as a section of the bundle.</desc>
