<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 500" width="680" height="500" xmlns="http://www.w3.org/2000/svg">
<title>The two projections of TTM onto TM, drawn on the manifolds</title>
<desc>A scene in perspective with four manifolds: at the bottom left TM (dim 2n) with the curve c; above it TTM (dim 4n), drawn as a box with an inner sheet along which runs the curve c' = X∘c and with a fibre of dimension 2n coming out of the top face; at the back centre M (dim n) with the curve tau_M∘c; on the right a second copy of TM with the curve (tau_M∘c)'. X rises from TM to TTM and tau_TM comes back down, flattening the whole fibre; T tau_M comes down from TTM to the right copy of TM, keeping only the horizontal part; tau_M carries TM into M and T(tau_M∘c) lifts the curve from M to the right copy. Id identifies the two copies of TM.</desc>
