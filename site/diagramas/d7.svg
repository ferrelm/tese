<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 244" width="680" height="244" xmlns="http://www.w3.org/2000/svg">
<title>Vector bundle mapping: f carries M into N and Tf carries TM into TN preserving the fibres</title>
<desc>Two bases, M and N, drawn as planes in perspective; over each one stands its fibre, drawn as a vertical box, TM and TN. The section X over the point m is carried by Tf into the section f*X over n = f(m). The square commutes: Tf preserves fibres and is linear on each of them.</desc>
<defs><marker id="e6ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#1a1208" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="e6acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#8b6239" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M 110,182 L 250,182 L 284,150 L 144,150 Z" fill="rgba(138,188,155,0.13)" stroke="#a08050" stroke-width="0.9"/><text x="84.0" y="178.0" font-size="15" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">M</text><path d="M 150,168 L 210,168 L 210,64 L 150,64 Z" fill="rgba(150,175,215,0.12)" stroke="#a08050" stroke-width="0.9"/><text x="150.0" y="52.0" font-size="15" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">TM</text><circle cx="180.0" cy="168.0" r="2.6" fill="#1a1208"/><text x="176.0" y="198.0" font-size="12" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">m</text><path d="M 180.0,166.0 Q 180.0,132.0 180.0,98.0" fill="none" stroke="#1a1208" stroke-width="1.5" stroke-linecap="round" marker-end="url(#e6ink)"/><text x="189.0" y="106.0" font-size="13" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">X</text>
<path d="M 430,182 L 570,182 L 604,150 L 464,150 Z" fill="rgba(138,188,155,0.13)" stroke="#a08050" stroke-width="0.9"/><text x="612.0" y="178.0" font-size="15" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">N</text><path d="M 470,168 L 530,168 L 530,64 L 470,64 Z" fill="rgba(150,175,215,0.12)" stroke="#a08050" stroke-width="0.9"/><text x="470.0" y="52.0" font-size="15" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">TN</text><circle cx="500.0" cy="168.0" r="2.6" fill="#1a1208"/><text x="496.0" y="198.0" font-size="12" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">n</text><path d="M 500.0,166.0 Q 500.0,132.0 500.0,98.0" fill="none" stroke="#5c3d1e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#e6acc)"/><text x="509.0" y="106.0" font-size="13" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#5c3d1e">f∗X</text>
<path d="M 258.0,176.0 Q 329.0,166.0 400.0,176.0" fill="none" stroke="#1a1208" stroke-width="1.4" stroke-linecap="round" marker-end="url(#e6ink)"/>
<text x="330.0" y="160.0" font-size="15" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208" text-anchor="middle">f</text>
<path d="M 214.0,82.0 Q 340.0,68.0 466.0,82.0" fill="none" stroke="#1a1208" stroke-width="1.4" stroke-linecap="round" marker-end="url(#e6ink)"/>
<text x="340.0" y="54.0" font-size="15" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208" text-anchor="middle">Tf</text>
<text x="340.0" y="228.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e" text-anchor="middle">fiber-preserving and linear on each fibre</text>
</svg>