<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 226" width="680" height="226" xmlns="http://www.w3.org/2000/svg">
<title>The kernel of a degenerate two-form</title>
<desc>At one point, two vectors u and v span a parallelogram whose signed area is what the form returns. A third direction k pairs to zero with both, and with everything else: it lies in the kernel, invisible to the form. Non-degeneracy is the absence of any such direction.</desc>
<defs><marker id="r3ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#1a1208" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r3acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#8b6239" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r3red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#9b3b26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r3fnt" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#6b5a3e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g transform="translate(0,-16)"><polygon points="118,196 244,166 318,94 192,124" fill="rgba(155,59,38,0.14)" stroke="#9b3b26" stroke-width="1.1"/>
<path d="M 118.0,196.0 Q 181.0,181.0 244.0,166.0" fill="none" stroke="#1a1208" stroke-width="1.7" stroke-linecap="round" marker-end="url(#r3ink)"/>
<path d="M 118.0,196.0 Q 155.0,160.0 192.0,124.0" fill="none" stroke="#1a1208" stroke-width="1.7" stroke-linecap="round" marker-end="url(#r3ink)"/>
<text x="250.0" y="172.0" font-size="13" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">u</text>
<text x="176.0" y="118.0" font-size="13" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#1a1208">v</text>
<text x="210.0" y="138.0" font-size="11.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">ω(u,v)</text>
<text x="210.0" y="152.0" font-size="10" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">an area</text>
<path d="M 118.0,196.0 Q 118.0,134.0 118.0,72.0" fill="none" stroke="#5c3d1e" stroke-width="1.8" stroke-linecap="round" marker-end="url(#r3acc)"/>
<text x="96.0" y="66.0" font-size="13" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#5c3d1e">k</text>
<circle cx="118.0" cy="196.0" r="3.2" fill="#1a1208"/>
<path d="M 122.0,100.0 Q 172.8,148.8 240.0,170.0" fill="none" stroke="#8b6239" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<path d="M 122.0,100.0 Q 148.8,128.7 188.0,128.0" fill="none" stroke="#8b6239" stroke-width="1" stroke-linecap="round" stroke-dasharray="4 3"/>
<text x="392.0" y="104.0" font-size="12" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#5c3d1e">ω(k, u) = ω(k, v) = 0</text>
<text x="392.0" y="130.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">k pairs to zero with everything:</text>
<text x="392.0" y="144.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">it is in the kernel, and ω does not</text>
<text x="392.0" y="158.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">see it. The rank counts only the</text>
<text x="392.0" y="172.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">directions ω does see; the form is</text>
<text x="392.0" y="186.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">non-degenerate when there is no</text>
<text x="392.0" y="200.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">such k at all.</text></g>
</svg>