<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 424" width="680" height="424" xmlns="http://www.w3.org/2000/svg">
<title>The chart φ carries the neighbourhood U of M onto the level sets y = const.</title>
<desc>On top, M drawn as a plane in perspective with the neighbourhood U inside it; U is crossed by the leaves of the foliation, with the leaf L-alpha through m0 highlighted. The arrow phi = (x,y) goes down to the product R^p × R^(m−p), drawn below as a rectangle: there the leaves appear as horizontal levels and each one corresponds to a point of the transverse axis R^(m−p); the highlighted leaf is the level y = c.</desc>
