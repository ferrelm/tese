<?xml version="1.0" encoding="UTF-8"?><svg role="img" viewBox="0 0 680 262" width="680" height="262" xmlns="http://www.w3.org/2000/svg">
<title>Level sets at a regular value and at a critical value</title>
<desc>The level sets of a function near a saddle. Away from the centre they are smooth curves, one for each regular value, and they stack up like a foliation. At the centre the differential vanishes: the level set through it is a pair of crossing curves, not a submanifold.</desc>
<defs><marker id="r1ink" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#1a1208" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r1acc" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#8b6239" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r1red" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#9b3b26" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="r1fnt" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M1.6 1.3L8.6 5L1.6 8.7" fill="none" stroke="#6b5a3e" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<path d="M 262.0,64.7 C 264.3,68.6 270.3,81.9 276.0,88.2 C 281.7,94.6 288.3,98.9 296.0,102.8 C 303.7,106.7 312.3,109.3 322.0,111.7 C 331.7,114.0 342.3,115.6 354.0,117.2 C 365.7,118.7 385.7,120.2 392.0,120.8" fill="none" stroke="#6b5a3e" stroke-width="1.3" stroke-linecap="round"/>
<path d="M 210.0,199.3 C 207.7,195.4 201.7,182.1 196.0,175.8 C 190.3,169.4 183.7,165.1 176.0,161.2 C 168.3,157.3 159.7,154.7 150.0,152.3 C 140.3,150.0 129.7,148.4 118.0,146.8 C 106.3,145.3 86.3,143.8 80.0,143.2" fill="none" stroke="#6b5a3e" stroke-width="1.3" stroke-linecap="round"/>
<path d="M 262.0,199.3 C 264.3,195.4 270.3,182.1 276.0,175.8 C 281.7,169.4 288.3,165.1 296.0,161.2 C 303.7,157.3 312.3,154.7 322.0,152.3 C 331.7,150.0 342.3,148.4 354.0,146.8 C 365.7,145.3 385.7,143.8 392.0,143.2" fill="none" stroke="#8b6239" stroke-width="1.3" stroke-linecap="round"/>
<path d="M 210.0,64.7 C 207.7,68.6 201.7,81.9 196.0,88.2 C 190.3,94.6 183.7,98.9 176.0,102.8 C 168.3,106.7 159.7,109.3 150.0,111.7 C 140.3,114.0 129.7,115.6 118.0,117.2 C 106.3,118.7 86.3,120.2 80.0,120.8" fill="none" stroke="#8b6239" stroke-width="1.3" stroke-linecap="round"/>
<path d="M 68.0,132.0 L 404.0,132.0" stroke="#9b3b26" stroke-width="1.9" stroke-linecap="round" fill="none"/>
<path d="M 236.0,28.0 L 236.0,236.0" stroke="#9b3b26" stroke-width="1.9" stroke-linecap="round" fill="none"/>
<circle cx="236.0" cy="132.0" r="3.4" fill="#9b3b26"/>
<path d="M 128.0,56.0 Q 143.3,82.7 170.0,98.0" fill="none" stroke="#6b5a3e" stroke-width="1" stroke-linecap="round" marker-end="url(#r1fnt)"/>
<text x="64.0" y="36.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">f = c, a regular value:</text>
<text x="64.0" y="50.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">the level set is a submanifold</text>
<path d="M 358.0,212.0 Q 298.8,187.5 250.0,146.0" fill="none" stroke="#9b3b26" stroke-width="1" stroke-linecap="round" marker-end="url(#r1red)"/>
<text x="364.0" y="220.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">f = 0, a critical value: df = 0 at the</text>
<text x="364.0" y="234.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">crossing, and there the level set is not</text>
<text x="364.0" y="248.0" font-size="10.5" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#9b3b26">a submanifold — it is two curves meeting</text>
<text x="430.0" y="70.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">Level sets of an observable.</text>
<text x="430.0" y="86.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">Away from the critical points</text>
<text x="430.0" y="102.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">they stack up as a foliation;</text>
<text x="430.0" y="118.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">at a critical point they cross,</text>
<text x="430.0" y="134.0" font-size="11" font-family="'EB Garamond',Georgia,serif" font-style="italic" fill="#6b5a3e">and the stack breaks down.</text>
</svg>